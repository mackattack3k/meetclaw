<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetClaw</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="dot" id="status-dot"></span>
          <h1>Meet<span class="brand-accent">Claw</span></h1>
        </div>
        <input
          id="title-input"
          class="title-input"
          placeholder="Untitled meeting"
          title="Meeting title"
        />
        <button id="toggle-btn" class="btn btn-primary">Start</button>
      </header>

      <div class="toolbar">
        <div class="toolbar-group">
          <button id="library-btn" class="btn btn-ghost">Library</button>
          <button id="new-btn" class="btn btn-ghost">New</button>
        </div>
        <div class="toolbar-group">
          <label class="field">
            <span class="field-label">Mic</span>
            <select id="device-select" class="select" title="Input device">
              <option value="">Default mic</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Model</span>
            <select id="model-select" class="select" title="Analysis model">
              <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
              <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
              <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
            </select>
          </label>
        </div>
      </div>

      <p id="status-text" class="status">Idle — press start to begin transcribing.</p>

      <div class="content">
        <section class="panel">
          <div class="panel-head">
            <span class="panel-title">Transcript</span>
          </div>
          <div class="scroll" id="transcript" aria-live="polite">
            <p class="placeholder">Transcript will appear here…</p>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <span class="panel-title">My notes</span>
          </div>
          <textarea
            id="notes"
            class="notes"
            placeholder="Jot your own notes… the assistant reads these too."
          ></textarea>
        </section>

        <section class="panel panel-accent">
          <div class="panel-head">
            <span class="panel-title">Suggested questions</span>
          </div>
          <div class="scroll" id="suggestions" aria-live="polite">
            <p class="placeholder">Questions will appear here…</p>
          </div>
        </section>
      </div>
    </main>

    <div id="library" class="library hidden">
      <div class="library-panel">
        <div class="library-header">
          <h2>Meetings</h2>
          <button id="library-close" class="btn btn-ghost">Close</button>
        </div>
        <div id="library-list" class="library-list"></div>
      </div>
    </div>
  </body>
</html>
