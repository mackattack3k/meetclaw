<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetClaw</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0" />
              <path d="M12 18v3" />
            </svg>
          </span>
          <span class="wordmark">MeetClaw</span>
        </div>

        <input
          id="title-input"
          class="title-input"
          placeholder="Untitled meeting"
          title="Meeting title"
        />

        <div class="topbar-actions">
          <div id="rec-pill" class="rec-pill hidden" title="Recording time">
            <span class="rec-dot"></span>
            <span class="rec-label">REC</span>
            <span id="rec-time" class="rec-time">0:00</span>
          </div>
          <button id="new-btn" class="btn btn-ghost">New</button>
          <button id="toggle-btn" class="btn btn-primary btn-rec" aria-label="Start recording" title="Start recording">
            <svg class="i-rec" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="#e5484d" /></svg>
            <svg class="i-stop" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2" fill="currentColor" /></svg>
          </button>
        </div>
      </header>

      <section class="signal">
        <div class="cam">
          <span id="cam-live" class="cam-live hidden"><span class="cam-live-dot"></span>LIVE</span>
          <div class="cam-ph" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 7l-7 5 7 5V7z" />
              <rect x="1" y="5" width="15" height="14" rx="2" />
            </svg>
          </div>
          <div id="camera-preview" class="camera-preview hidden">
            <img id="camera-img" class="camera-img" alt="Latest camera frame" />
          </div>
          <span class="cam-label">You</span>
        </div>

        <div class="signal-main">
          <span class="signal-label">Input level</span>
          <div id="meter" class="meter" title="Live input level">
            <canvas id="meter-canvas" class="meter-canvas"></canvas>
          </div>
        </div>

        <span id="meter-db" class="meter-db">—</span>
      </section>

      <div class="controls">
        <div class="tabs">
          <button id="library-btn" class="tab">Library</button>
        </div>

        <div class="ctrl">
          <span class="ctrl-label">Source</span>
          <div class="segmented" id="source-seg" role="group" aria-label="Audio source">
            <button type="button" class="seg" data-source="mic">Mic</button>
            <button type="button" class="seg" data-source="system">System</button>
            <button type="button" class="seg" data-source="both">Both</button>
          </div>
        </div>

        <div class="ctrl">
          <span class="ctrl-label">Mic</span>
          <select id="device-select" class="select" title="Input device">
            <option value="">Default</option>
          </select>
        </div>

        <div class="ctrl">
          <span class="ctrl-label">Camera</span>
          <button
            type="button"
            class="camera-toggle"
            id="camera-btn"
            aria-pressed="false"
            title="Capture camera frames (~1 Hz) while recording"
          >
            Off
          </button>
        </div>

        <div class="ctrl">
          <span class="ctrl-label">Lang<span id="detected-lang" class="ctrl-sub"></span></span>
          <select id="lang-select" class="select" title="Transcription language">
            <option value="auto">Auto-detect</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="nl">Dutch</option>
            <option value="sv">Swedish</option>
            <option value="da">Danish</option>
            <option value="no">Norwegian</option>
            <option value="fi">Finnish</option>
            <option value="pl">Polish</option>
            <option value="ru">Russian</option>
            <option value="uk">Ukrainian</option>
            <option value="tr">Turkish</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
          </select>
        </div>

        <div class="ctrl">
          <span class="ctrl-label">Model</span>
          <select id="model-select" class="select" title="Analysis model">
            <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
            <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
          </select>
        </div>

        <button
          id="theme-btn"
          class="icon-btn"
          title="Toggle light / dark theme"
          aria-label="Toggle theme"
        >
          <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        </button>
      </div>

      <div class="statusline">
        <span class="dot" id="status-dot"></span>
        <p id="status-text" class="status">Idle — press start to begin transcribing.</p>
      </div>

      <div class="content">
        <section class="panel">
          <div class="panel-head">
            <span class="panel-title">Transcript</span>
            <span id="transcript-live" class="badge-live hidden"><span class="badge-dot"></span>Live</span>
            <div id="player" class="player hidden">
              <button id="play-btn" class="play-btn" aria-label="Play / pause">
                <svg class="i-play" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
                <svg class="i-pause" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
              </button>
              <input id="seek" class="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
              <span id="time" class="player-time">0:00</span>
            </div>
          </div>
          <div class="scroll" id="transcript" aria-live="polite">
            <p class="placeholder">Transcript will appear here…</p>
          </div>
        </section>
        <audio id="audio" preload="metadata"></audio>

        <section class="panel">
          <div class="panel-head">
            <span class="panel-title">My notes</span>
            <span id="saved-status" class="saved hidden" title="Notes and title auto-save as you go">
              <svg class="saved-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 6 9 17l-5-5" />
              </svg>
              <span id="saved-text">Saved</span>
            </span>
            <svg class="panel-pencil" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
            </svg>
          </div>
          <textarea
            id="notes"
            class="notes"
            placeholder="Jot your own notes… the assistant reads these too."
          ></textarea>
        </section>

        <section class="panel panel-accent">
          <div class="panel-head">
            <span class="panel-plus" aria-hidden="true">+</span>
            <span class="panel-title">Assistant</span>
            <label class="auto-toggle" title="Run every proposed action without asking">
              <input type="checkbox" id="agent-auto" />
              <span>Auto</span>
            </label>
          </div>
          <div class="scroll" id="assistant-scroll" aria-live="polite">
            <div id="suggestions">
              <p class="placeholder">Questions will appear here…</p>
            </div>
            <div id="agent-log"></div>
          </div>
          <form id="ask-form" class="ask">
            <input
              id="ask-input"
              class="ask-input"
              placeholder="Ask the agent to do something…"
              autocomplete="off"
            />
            <button type="submit" class="ask-btn" id="ask-btn">Ask</button>
          </form>
        </section>
      </div>
    </main>

    <div id="library" class="library hidden">
      <div class="library-panel">
        <div class="library-header">
          <h2>Meetings</h2>
          <button id="library-close" class="btn btn-ghost">Close</button>
        </div>
        <div id="library-list" class="library-list"></div>
      </div>
    </div>

  </body>
</html>
