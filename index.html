<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetClaw</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="dot" id="status-dot"></span>
          <h1>MeetClaw</h1>
        </div>
        <input
          id="title-input"
          class="title-input"
          placeholder="Untitled meeting"
          title="Meeting title"
        />
        <div class="controls">
          <button id="library-btn" class="btn btn-secondary">Library</button>
          <button id="new-btn" class="btn btn-secondary">New</button>
          <select id="model-select" class="select" title="Analysis model">
            <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
            <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
          </select>
          <button id="toggle-btn" class="btn">Start listening</button>
        </div>
      </header>

      <p id="status-text" class="status">Idle. Press start to begin transcribing.</p>

      <div class="content">
        <section class="panel">
          <h2 class="panel-title">Transcript</h2>
          <div class="scroll" id="transcript" aria-live="polite">
            <p class="placeholder">Transcript will appear here…</p>
          </div>
        </section>

        <section class="panel">
          <h2 class="panel-title">My notes</h2>
          <textarea
            id="notes"
            class="notes"
            placeholder="Jot your own notes… the assistant reads these too."
          ></textarea>
        </section>

        <section class="panel">
          <h2 class="panel-title">Suggested questions</h2>
          <div class="scroll" id="suggestions" aria-live="polite">
            <p class="placeholder">Questions will appear here…</p>
          </div>
        </section>
      </div>
    </main>

    <div id="library" class="library hidden">
      <div class="library-panel">
        <div class="library-header">
          <h2>Meetings</h2>
          <button id="library-close" class="btn btn-secondary">Close</button>
        </div>
        <div id="library-list" class="library-list"></div>
      </div>
    </div>
  </body>
</html>
