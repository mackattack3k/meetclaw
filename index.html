<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetClaw</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="dot" id="status-dot"></span>
          <h1>MeetClaw</h1>
        </div>
        <div class="controls">
          <select id="model-select" class="select" title="Analysis model">
            <option value="claude-opus-4-8">Opus 4.8</option>
            <option value="claude-sonnet-4-6">Sonnet 4.6</option>
            <option value="claude-haiku-4-5">Haiku 4.5</option>
          </select>
          <button id="toggle-btn" class="btn">Start listening</button>
        </div>
      </header>

      <p id="status-text" class="status">Idle. Press start to begin transcribing.</p>

      <div class="content">
        <section class="panel">
          <h2 class="panel-title">Transcript</h2>
          <div class="scroll" id="transcript" aria-live="polite">
            <p class="placeholder">Transcript will appear here…</p>
          </div>
        </section>

        <section class="panel">
          <h2 class="panel-title">Suggested questions</h2>
          <div class="scroll" id="suggestions" aria-live="polite">
            <p class="placeholder">Questions will appear here…</p>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
