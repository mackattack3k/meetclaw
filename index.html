<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetClaw</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="dot" id="status-dot"></span>
          <h1>Meet<span class="brand-accent">Claw</span></h1>
        </div>
        <input
          id="title-input"
          class="title-input"
          placeholder="Untitled meeting"
          title="Meeting title"
        />
        <button id="toggle-btn" class="btn btn-primary">Start</button>
      </header>

      <div class="toolbar">
        <div class="toolbar-group">
          <button id="library-btn" class="btn btn-ghost">Library</button>
          <button id="new-btn" class="btn btn-ghost">New</button>
        </div>
        <div class="toolbar-group">
          <span id="active-lang" class="model-chip"></span>
          <span id="active-model" class="model-chip"></span>
          <button id="settings-btn" class="btn btn-ghost">Settings</button>
        </div>
      </div>

      <p id="status-text" class="status">Idle — press start to begin transcribing.</p>

      <div class="content">
        <section class="panel">
          <div class="panel-head">
            <span class="panel-title">Transcript</span>
          </div>
          <div class="scroll" id="transcript" aria-live="polite">
            <p class="placeholder">Transcript will appear here…</p>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <span class="panel-title">My notes</span>
          </div>
          <textarea
            id="notes"
            class="notes"
            placeholder="Jot your own notes… the assistant reads these too."
          ></textarea>
        </section>

        <section class="panel panel-accent">
          <div class="panel-head">
            <span class="panel-title">Suggested questions</span>
          </div>
          <div class="scroll" id="suggestions" aria-live="polite">
            <p class="placeholder">Questions will appear here…</p>
          </div>
        </section>
      </div>
    </main>

    <div id="library" class="library hidden">
      <div class="library-panel">
        <div class="library-header">
          <h2>Meetings</h2>
          <button id="library-close" class="btn btn-ghost">Close</button>
        </div>
        <div id="library-list" class="library-list"></div>
      </div>
    </div>

    <div id="settings" class="library hidden">
      <div class="library-panel">
        <div class="library-header">
          <h2>Settings</h2>
          <button id="settings-close" class="btn btn-ghost">Close</button>
        </div>
        <div class="settings-body">
          <label class="setting">
            <span class="setting-label">Analysis model</span>
            <select id="model-select" class="select">
              <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
              <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
              <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
            </select>
          </label>

          <label class="setting">
            <span class="setting-label">Input device</span>
            <select id="device-select" class="select">
              <option value="">Default mic</option>
            </select>
          </label>

          <label class="setting">
            <span class="setting-label">Language</span>
            <select id="lang-select" class="select">
              <option value="auto">Auto-detect</option>
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="it">Italian</option>
              <option value="pt">Portuguese</option>
              <option value="nl">Dutch</option>
              <option value="sv">Swedish</option>
              <option value="da">Danish</option>
              <option value="no">Norwegian</option>
              <option value="fi">Finnish</option>
              <option value="pl">Polish</option>
              <option value="ru">Russian</option>
              <option value="uk">Ukrainian</option>
              <option value="tr">Turkish</option>
              <option value="ar">Arabic</option>
              <option value="hi">Hindi</option>
              <option value="zh">Chinese</option>
              <option value="ja">Japanese</option>
              <option value="ko">Korean</option>
            </select>
          </label>

          <div class="setting">
            <span class="setting-label">Save location</span>
            <div class="setting-row">
              <span id="save-dir" class="path-display">—</span>
              <button id="choose-dir" class="btn btn-ghost">Choose…</button>
              <button id="reset-dir" class="btn btn-ghost">Default</button>
            </div>
          </div>

          <div class="setting">
            <span class="setting-label">Gemini API key</span>
            <div class="setting-row">
              <input
                id="api-key"
                class="text-input"
                type="password"
                placeholder="Paste key…"
                autocomplete="off"
              />
              <button id="save-key" class="btn btn-primary">Save</button>
            </div>
            <span id="key-status" class="setting-hint"></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
