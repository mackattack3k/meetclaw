<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
  </head>
  <body class="settings-window">
    <main class="settings-shell">
      <h1 class="settings-title">Settings</h1>
      <p class="settings-note">
        Source, mic, language, and model live in the main window's console bar —
        change them any time. This is for the things you set once.
      </p>

      <div class="setting">
        <span class="setting-label">Save location</span>
        <div class="setting-row">
          <span id="save-dir" class="path-display">—</span>
          <button id="choose-dir" class="btn btn-ghost">Choose…</button>
          <button id="reset-dir" class="btn btn-ghost">Default</button>
        </div>
      </div>

      <div class="setting">
        <span class="setting-label">Gemini API key</span>
        <div class="setting-row">
          <input
            id="api-key"
            class="text-input"
            type="password"
            placeholder="Paste key…"
            autocomplete="off"
          />
          <button id="save-key" class="btn btn-primary">Save</button>
        </div>
        <span id="key-status" class="setting-hint"></span>
      </div>

      <p id="settings-status" class="settings-status"></p>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
